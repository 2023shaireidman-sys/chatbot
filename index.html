<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="escenario-fondo">
        <!-- Lado Izquierdo: Sala de Estudio / Biblioteca -->
        <div class="lado-estudio">
            <div class="biblioteca-bg"></div>
            <div class="mesa-silla"></div>
        </div>
        <!-- Lado Derecho: Cancha de Fútbol -->
        <div class="lado-futbol">
            <div class="cancha-bg"></div>
            <div class="lineas-cancha"></div>
        </div>
    </div>

    <!-- Estructura del Chat según Boceto -->
    <main class="chat-contenedor">
        <header class="chat-header">
            <h1>Chat de IA</h1>
            <p class="subtitulo">Asistente de Fútbol y Estudio</p>
        </header>

        <!-- Zona de Mensajes -->
        <section class="zonas-de-mensajes" id="zonas-de-mensajes" aria-live="polite">
            <!-- Los mensajes e interacciones se renderizan dinámicamente -->
        </section>

        <!-- Ingresos de Opciones -->
        <footer class="ingresos-de-opciones" id="ingresos-de-opciones">
            <!-- Los botones de opciones e inputs requeridos se cargan aquí -->
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
